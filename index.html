<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Companion for StarCraft II</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Build Order Companion</h1>
            <p class="subtitle"><a href="https://lotv.spawningtool.com/build/179524/" target="_new">Get example SALT from SpawningTool</a></p>
            <form id="saltForm">
                <input type="text" id="saltInput" placeholder="Enter SALT string" required>
                <button type="submit">Decode</button>
            </form>
            <div id="timer">
                <button id="timerStart">Start</button>
                <span id="timerDisplay">00:00</span>
            </div>
        </header>
        <div id="result"></div>
    </div>
    <script src="./poc.js"></script>
    <script type="module" src="./main.mjs"></script>
</body>
</html>
