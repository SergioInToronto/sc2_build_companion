<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC2 Build Order Companion</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            color: #e0e0e0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 16px;
        }

        h1 { font-size: 1.8rem; }

        .subtitle {
            font-size: 0.75rem;
            color: #888;
        }

        .subtitle a { color: #7aaedf; text-decoration: none; }
        .subtitle a:hover { text-decoration: underline; }

        form {
            display: flex;
            gap: 8px;
        }

        form input {
            flex: 1;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.95rem;
        }

        form button {
            padding: 8px 16px;
            background: #2d5f8a;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
        }

        form button:hover { background: #3a78b0; }

        #result {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .step-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            background: #242424;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 12px;
        }

        .step-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .step-info {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 4px;
        }

        .step-top {
            font-size: 14px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        .step-bottom {
            font-size: 20px;
            font-weight: 600;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>SC2 Build Order Companion</h1>
        <p class="subtitle"><a href="https://lotv.spawningtool.com/build/179524/">Get example SALT from SpawningTool</a></p>
        <form id="saltForm">
            <input type="text" id="saltInput" placeholder="Enter SALT string" required>
            <button type="submit">Decode</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="./poc.js"></script>
    <script type="module" src="./main.mjs"></script>
</body>
</html>
